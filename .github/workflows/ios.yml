name: iOS Build & Test

on:
  push:
    branches: [main, 001-flutter-foundation]
  pull_request:
    branches: [main]

jobs:
  ios:
    name: Build & test on iOS Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Static analysis
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Boot iPhone 15 simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 " | grep -v "Plus\|Pro" | head -1 | awk -F'[()]' '{print $2}')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true

      - name: Build iOS (no codesign)
        run: |
          flutter build ios \
            --simulator \
            --dart-define=API_BASE_URL=http://localhost:8000/api \
            --no-codesign
